name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run models
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    # Exercise the deployed site against the real paper APIs and arXiv.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live smoke tests
        run: npx playwright test e2e/live.spec.ts
        env:
          PAPERTRAIL_LIVE_URL: https://gaganpraveen.github.io/papertrail/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7
