name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run models
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
