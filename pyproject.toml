[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-arxiv"
version = "0.1.0"
description = "An evidence-first arXiv briefing and question-answering agent."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Gagan P"}]
dependencies = [
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "pdfplumber>=0.11,<1",
  "qdrant-client>=1.13,<2", "fastembed>=0.5,<1", "typer>=0.15,<1",
  "rich>=13,<15", "filelock>=3,<4", "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.9,<1", "reportlab>=4,<5"]

[project.scripts]
papertrail = "papertrail.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires arXiv, downloaded embeddings and a running Ollama model"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
